<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivia Valle Viejo</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trivia VV">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #1a2e10;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* ── App shell ─────────────────────────────── */
    #app {
      width: 100%;
      min-height: 100dvh;
      position: relative;
      border-radius: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 28px 48px;
      gap: 0;
    }

    /* Desktop horizontal landscape layout */
    @media (min-width: 1025px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        overflow-x: hidden;
      }
      #app {
        width: 100%;
        min-height: 100dvh;
        border-radius: 0;
      }
      .content {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas: 
          "header center"
          "tagline center"
          "footer center";
        align-items: center;
        justify-items: center;
        padding: 60px 40px;
        height: 100%;
        gap: 20px;
      }
      .header-content {
        grid-area: header;
        justify-self: center;
      }
      .center-content {
        grid-area: center;
        height: 100%;
        justify-content: center;
      }
      .tagline {
        grid-area: tagline;
        font-size: 24px;
        margin-top: 0;
      }
      .footer-logos {
        grid-area: footer;
        margin-top: 0;
        gap: 32px;
      }
      .titulo-img {
        max-width: 340px;
      }
      .trivia-img {
        max-width: 480px;
      }
      .btn-iniciar {
        max-width: 450px;
        padding: 24px 0;
        font-size: 32px;
      }
      .condor-inicio {
        width: 220px;
        margin-left: -200px;
        margin-bottom: -30px;
      }
      .footer-logos img {
        height: 60px;
        max-width: 160px;
      }
    }

    /* ── Background image ───────────────────────── */
    .bg {
      position: absolute;
      inset: 0;
      background: url('fondotrivia.webp') center center / cover no-repeat;
      z-index: 0;
      animation: bgReveal 0.8s ease both;
    }
    @keyframes bgReveal {
      from { opacity: 0; transform: scale(1.06); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* dark vignette so elements pop */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center 60%, transparent 30%, rgba(0,0,0,0.45) 100%);
    }

    /* floating particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp linear infinite;
      opacity: 0.45;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0)    scale(1);   opacity: 0.45; }
      100% { transform: translateY(-720px) scale(0); opacity: 0; }
    }

    /* ── Content layer ──────────────────────────── */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1;
      position: relative;
    }

    /* ── Title image (Valle Viejo) ──────────────── */
    .titulo-img {
      width: 62%;
      max-width: 230px;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55));
      animation: slideDown 0.7s cubic-bezier(.34,1.56,.64,1) 0.3s both;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-60px) scale(0.8); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* ── Trivia logo ────────────────────────────── */
    .trivia-img {
      width: 88%;
      max-width: 320px;
      margin-top: -8px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
      animation: bouncePop 0.8s cubic-bezier(.34,1.56,.64,1) 0.65s both,
                 triviaPulse 3s ease-in-out 1.5s infinite;
    }
    @keyframes bouncePop {
      from { opacity: 0; transform: scale(0.4) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1)   rotate(0deg); }
    }
    @keyframes triviaPulse {
      0%,100% { transform: scale(1)    rotate(-1.5deg); }
      25%     { transform: scale(1.04) rotate(1.5deg); }
      50%     { transform: scale(1.06) rotate(-0.8deg); }
      75%     { transform: scale(1.03) rotate(1.2deg); }
    }

    /* ── Spacer ─────────────────────────────────── */
    .spacer { flex: 1; }

    /* ── Stars decorativas ──────────────────────── */
    .stars {
      display: flex;
      gap: 10px;
      margin-top: 0;
      animation: fadeUp 0.6s ease 1.1s both;
    }
    .star {
      font-size: 22px;
      animation: starBounce 2s ease-in-out infinite;
    }
    .star:nth-child(2) { animation-delay: 0.2s; }
    .star:nth-child(3) { animation-delay: 0.4s; }
    @keyframes starBounce {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Iniciar button ─────────────────────────── */
    .btn-iniciar {
      width: 100%;
      max-width: 300px;
      margin-top: 0;
      padding: 20px 0;
      border: none;
      border-radius: 60px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      overflow: hidden;
      animation: slideUp 0.7s cubic-bezier(.34,1.56,.64,1) 1s both,
                 btnGlow 2.2s ease-in-out 1.8s infinite;
      transition: transform 0.15s, filter 0.15s;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(60px) scale(0.85); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }
    @keyframes btnGlow {
      0%,100% { box-shadow: 0 0 0   0 rgba(34,197,94,0.55), 0 8px 32px rgba(34,197,94,0.35); }
      50%     { box-shadow: 0 0 28px 8px rgba(34,197,94,0.4),  0 8px 32px rgba(34,197,94,0.35); }
    }
    .btn-iniciar:hover  { transform: scale(1.05); filter: brightness(1.1); }
    .btn-iniciar:active { transform: scale(0.96); }

    /* ripple on click */
    .btn-iniciar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--rx,50%) var(--ry,50%), rgba(255,255,255,0.35), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .btn-iniciar.ripple::after { opacity: 1; }

    /* ── Tagline ────────────────────────────────── */
    .tagline {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      animation: fadeUp 0.6s ease 1.3s both;
    }

    /* ── Footer Logos ───────────────────────────── */
    .footer-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 18px;
      animation: fadeUp 0.6s ease 1.4s both;
      width: 100%;
    }
    .footer-logos img {
      height: 38px;
      max-width: 100px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
    }

    /* ══ EXIT ANIMATION ═════════════════════════ */
    #app.exit {
      animation: exitBlast 0.55s cubic-bezier(.55,0,1,.45) forwards;
    }
    @keyframes exitBlast {
      0%   { opacity: 1; transform: scale(1)    rotate(0deg); }
      40%  { opacity: 1; transform: scale(1.07) rotate(1deg); }
      100% { opacity: 0; transform: scale(0.82) rotate(-2deg); }
    }

    /* ── Condor Inicio ──────────────────────────── */
    .condor-inicio {
      position: absolute;
      bottom: 50%;
      margin-bottom: -25px; /* aligns bottom of condor behind the button */
      left: 50%;
      margin-left: -115px; /* shifted to the left */
      width: 130px;
      height: auto;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.45));
      animation: condorInicioEntrance 0.8s cubic-bezier(.34,1.56,.64,1) 1.2s both,
                 condorInicioFloat 3s ease-in-out infinite alternate;
    }
    .condor-inicio.fly-away {
      animation: condorFlyAway 0.55s cubic-bezier(.25, 1, .50, 1) forwards !important;
    }
    @keyframes condorInicioEntrance {
      from { opacity: 0; transform: translateY(40px) scale(0.7); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes condorInicioFloat {
      from { transform: translateY(0); }
      to   { transform: translateY(-8px); }
    }
    @keyframes condorFlyAway {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
    }

    /* ── Tablet pequeña / móvil grande (600-767px) ── */
    @media (min-width: 600px) and (max-width: 767px) {
      .content {
        max-width: 580px;
        padding-top: 50px;
        padding-bottom: 50px;
      }
      .titulo-img {
        max-width: 260px;
      }
      .trivia-img {
        max-width: 360px;
        margin-top: -10px;
      }
      .btn-iniciar {
        max-width: 360px;
        padding: 22px 0;
        font-size: 26px;
      }
      .condor-inicio {
        width: 160px;
        margin-left: -148px;
        margin-bottom: -28px;
      }
      .tagline {
        font-size: 16px;
        margin-top: 20px;
      }
      .footer-logos {
        gap: 20px;
        margin-top: 24px;
      }
      .footer-logos img {
        height: 48px;
        max-width: 120px;
      }
    }

    /* ── Tablet portrait 768px-1024px (ej. 1200x2000) ── */
    @media (min-width: 768px) and (max-width: 1024px) {
      #app {
        padding: 40px 32px;
      }
      .content {
        max-width: 660px;
        padding-top: 0;
        padding-bottom: 0;
      }
      .titulo-img {
        max-width: 220px;
      }
      .trivia-img {
        max-width: 380px;
        margin-top: -12px;
      }
      .btn-iniciar {
        max-width: 420px;
        padding: 22px 0;
        font-size: 28px;
      }
      .condor-inicio {
        width: 180px;
        margin-left: -165px;
        margin-bottom: -30px;
      }
      .tagline {
        font-size: 18px;
        margin-top: 22px;
      }
      .footer-logos {
        gap: 24px;
        margin-top: 28px;
      }
      .footer-logos img {
        height: 52px;
        max-width: 140px;
      }
    }

  </style>
</head>
<body>

<div id="app">
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="content">
    <div class="header-content">
      <img class="titulo-img" src="titulovertical2.png" alt="Valle Viejo"/>
      <img class="trivia-img"  src="trivia.png"          alt="¡TRIVIA!"/>
    </div>

    <div class="center-content">
      <img src="condorinicio.webp" class="condor-inicio" id="condorInicio" alt="Cóndor" />
      <button class="btn-iniciar" id="btnIniciar" onclick="iniciar(this, event)">
        INICIAR
      </button>
    </div>

    <p class="tagline">¿Cuánto sabés sobre Valle Viejo?</p>
    <div class="footer-logos">
      <img src="valleviejofooter.png" alt="Valle Viejo Footer" />
      <img src="valleviejoredes.png" alt="Valle Viejo Redes" />
      <img src="susana.png" alt="Susana" />
    </div>
  </div>
</div>

<script>
// ── Audio Engine ────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let _actx = null;
function actx() { if (!_actx) _actx = new AudioCtx(); return _actx; }

// Jingle de intro (se toca al cargar)
function sndIntro() {
  const c = actx();
  // arpegio ascendente suave
  [[0, 392], [0.13, 523.25], [0.26, 659.25], [0.39, 783.99], [0.52, 1046.5]].forEach(([t, f]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, c.currentTime + t);
    g.gain.linearRampToValueAtTime(0.22, c.currentTime + t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.35);
    o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.4);
  });
  // bajo percusivo
  const ob = c.createOscillator(), gb = c.createGain();
  ob.connect(gb); gb.connect(c.destination);
  ob.type = 'triangle'; ob.frequency.setValueAtTime(130, c.currentTime);
  ob.frequency.exponentialRampToValueAtTime(60, c.currentTime + 0.3);
  gb.gain.setValueAtTime(0.28, c.currentTime);
  gb.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.35);
  ob.start(); ob.stop(c.currentTime + 0.4);
}

// Tick hover
function sndHover() {
  const c = actx(), o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = 'sine'; o.frequency.setValueAtTime(1100, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(700, c.currentTime + 0.05);
  g.gain.setValueAtTime(0.15, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.07);
  o.start(); o.stop(c.currentTime + 0.08);
}

// Sonido de lanzamiento (al hacer click en Iniciar)
function sndLaunch() {
  const c = actx();
  // sweep ascendente poderoso
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(220, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(1760, c.currentTime + 0.38);
  g.gain.setValueAtTime(0.3, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.42);
  o.start(); o.stop(c.currentTime + 0.45);
  // acorde final
  [523.25, 659.25, 783.99].forEach((f, i) => {
    const o2 = c.createOscillator(), g2 = c.createGain();
    o2.connect(g2); g2.connect(c.destination);
    o2.type = 'triangle'; o2.frequency.value = f;
    g2.gain.setValueAtTime(0.18, c.currentTime + 0.3 + i * 0.06);
    g2.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.55 + i * 0.06);
    o2.start(c.currentTime + 0.3 + i * 0.06);
    o2.stop(c.currentTime + 0.6 + i * 0.06);
  });
}

// ── Particles ───────────────────────────────────────────────────
const colors = ['#22c55e','#f59e0b','#3b82f6','#ec4899','#a855f7','#f97316','#86efac'];
function makeParticles() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = 4 + Math.random() * 7;
    p.style.cssText = `
      left:${Math.random()*100}%;
      top:${50 + Math.random()*50}%;
      width:${s}px; height:${s}px;
      background:${colors[i % colors.length]};
      animation-duration:${5 + Math.random()*7}s;
      animation-delay:${Math.random()*5}s;
    `;
    c.appendChild(p);
  }
}

// ── Hover sound (once per entry) ────────────────────────────────
const btn = document.getElementById('btnIniciar');
let hovered = false;
btn.addEventListener('mouseenter', () => { if (!hovered) { sndHover(); hovered = true; } });
btn.addEventListener('mouseleave', () => { hovered = false; });

// ripple helper
btn.addEventListener('mousemove', e => {
  const r = btn.getBoundingClientRect();
  btn.style.setProperty('--rx', `${((e.clientX - r.left) / r.width) * 100}%`);
  btn.style.setProperty('--ry', `${((e.clientY - r.top) / r.height) * 100}%`);
});

// ── Iniciar ──────────────────────────────────────────────────────
function iniciar(el, event) {
  sndLaunch();
  el.classList.add('ripple');
  const app = document.getElementById('app');
  app.classList.add('exit');
  const condor = document.getElementById('condorInicio');
  if (condor) condor.classList.add('fly-away');
  setTimeout(() => {
    window.location.href = 'trivia.html';
  }, 550);
}

// ── Init ─────────────────────────────────────────────────────────
makeParticles();
// Intro sound after a short delay (needs user interaction on some browsers;
// we attach it to the first click anywhere as fallback too)
window.addEventListener('click', () => sndIntro(), { once: true });
setTimeout(() => {
  try { sndIntro(); } catch(e) {}
}, 1200);
</script>

<script>
  // Registro del Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .catch(err => console.warn('SW:', err));
    });
  }
</script>
</body>
</html>
