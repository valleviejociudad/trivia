<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivia Valle Viejo</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trivia VV">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100dvh;background:#1a2e10;margin:0;padding:0;overflow-x:hidden;}
#app{width:100%;min-height:100dvh;position:relative;font-family:'Nunito',sans-serif;overflow-y:auto;overflow-x:hidden;border-radius:0;}
@media(min-width:1025px){
  html,body{display:flex;align-items:center;justify-content:center;padding:0;}
  #app{width:100%;min-height:100dvh;border-radius:0;}
  .content {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 380px 1fr;
    grid-template-rows: auto auto auto 1fr;
    column-gap: 48px;
    row-gap: 16px;
    padding: 40px 40px;
    width: 100%;
    height: 100dvh;
    align-items: center;
  }
  .titulo-img {
    grid-column: 1;
    grid-row: 1;
    justify-self: center;
    max-width: 260px !important;
  }
  .trivia-logo-img {
    grid-column: 1;
    grid-row: 2;
    justify-self: center;
    margin: -16px 0 0 0 !important;
    max-width: 320px !important;
  }
  .progress-row {
    grid-column: 1;
    grid-row: 3;
    width: 100%;
    margin-top: 10px;
  }
  .progress-label {
    font-size: 16px;
    padding: 6px 16px;
  }
  .progress-track {
    height: 12px;
  }
  .condor-container {
    grid-column: 1;
    grid-row: 4;
    position: relative !important;
    bottom: auto !important;
    left: auto !important;
    right: auto !important;
    margin-top: 10px;
    width: 100%;
    align-self: start;
    gap: 12px;
  }
  .condor-avatar {
    width: 140px;
    height: 140px;
    margin-bottom: -10px;
  }
  .speech-bubble {
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 24px;
    border-width: 3px;
  }
  .speech-bubble::before {
    border-width: 12px 12px 12px 0;
    left: -14px;
    bottom: 22px;
  }
  .speech-bubble::after {
    border-width: 10px 10px 10px 0;
    left: -10px;
    bottom: 24px;
  }
  .question-card {
    grid-column: 2;
    grid-row: 1;
    padding: 30px 28px;
    border-radius: 28px;
  }
  .question-text {
    font-size: 24px;
  }
  .options {
    grid-column: 2;
    grid-row: 2;
    gap: 12px;
    margin-top: 10px;
  }
  .option-btn {
    padding: 16px 22px;
    border-radius: 20px;
  }
  .option-letter {
    width: 42px;
    height: 42px;
    font-size: 19px;
  }
  .option-text {
    font-size: 19px;
  }
  .nav-row {
    grid-column: 2;
    grid-row: 3;
    gap: 12px;
    margin-top: 12px;
  }
  .nav-btn {
    padding: 16px 22px;
    font-size: 18px;
  }
  .nav-next {
    font-size: 19px;
  }
  .score-screen {
    grid-column: 2;
    grid-row: 1 / span 3;
    align-self: center;
    padding: 40px 32px;
    border-radius: 28px;
    gap: 16px;
    max-width: 550px;
    justify-self: center;
  }
  .score-emoji {
    font-size: 80px;
  }
  .score-title {
    font-size: 36px;
  }
  .score-sub {
    font-size: 24px;
  }
  .score-num {
    font-size: 72px;
  }
  .score-comment {
    font-size: 22px;
  }
  .restart-btn {
    padding: 16px 48px;
    font-size: 20px;
  }
}
.bg{position:absolute;inset:0;background:url('fondotrivia.webp') center center / cover no-repeat;z-index:0;}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:20px 16px 16px;gap:10px;width:100%;max-width:480px;margin:0 auto;}
.brand-badge{width:52px;height:52px;border-radius:50%;background:#22c55e;border:3px solid white;display:flex;align-items:center;justify-content:center;margin-bottom:-4px;animation:badgeSpin 8s linear infinite,badgeBounce 2s ease-in-out infinite;transform-origin:center;}
@keyframes badgeSpin{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.4);}50%{box-shadow:0 0 0 12px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}}
@keyframes badgeBounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-4px) scale(1.08);}}
.brand-pill{animation:pillSlide 0.7s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes pillSlide{from{opacity:0;transform:translateY(-20px) scale(0.8);}to{opacity:1;transform:translateY(0) scale(1);}}
.titulo-img{max-width:220px;width:70%;animation:pillSlide 0.7s cubic-bezier(.34,1.56,.64,1) both;}
.trivia-logo-img{max-width:260px;width:80%;margin:-26px 0 4px 0;animation:logoPop 0.8s cubic-bezier(.34,1.56,.64,1) both, logoWiggle 3s ease-in-out 0.8s infinite;}
@keyframes logoPop{from{opacity:0;transform:scale(0.5) rotate(-6deg);}to{opacity:1;transform:scale(1) rotate(0);}}
@keyframes logoWiggle{0%,100%{transform:rotate(-2deg) scale(1);}25%{transform:rotate(2deg) scale(1.04);}50%{transform:rotate(-1deg) scale(1.06);}75%{transform:rotate(1.5deg) scale(1.03);}}
.progress-row{width:100%;display:flex;align-items:center;gap:8px;}
.progress-label{background:#22c55e;color:white;font-size:13px;font-weight:700;border-radius:20px;padding:5px 14px;white-space:nowrap;flex-shrink:0;animation:labelPop 0.5s cubic-bezier(.34,1.56,.64,1);}
@keyframes labelPop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.progress-track{flex:1;height:10px;background:rgba(255,255,255,0.35);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#86efac,#22c55e);background-size:200% 100%;border-radius:6px;transition:width 0.6s cubic-bezier(.34,1.56,.64,1);animation:shimmer 2s linear infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.question-card{background:white;border-radius:22px;padding:22px 20px 18px;text-align:center;width:100%;animation:cardEntrance 0.5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes cardEntrance{from{opacity:0;transform:translateY(30px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.question-text{font-size:19px;font-weight:800;color:#1a2e10;line-height:1.35;}
.options{width:100%;display:flex;flex-direction:column;gap:10px;}
.option-btn{width:100%;background:white;border:none;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;transition:transform 0.15s,background 0.25s;animation:optionSlide 0.4s cubic-bezier(.34,1.56,.64,1) both;position:relative;overflow:hidden;}
.option-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(34,197,94,0.15),transparent 70%);opacity:0;transition:opacity 0.3s;}
.option-btn:hover::before{opacity:1;}
.option-btn:hover{transform:translateX(6px) scale(1.02);}
.option-btn:active{transform:scale(0.97);}
.option-btn:nth-child(1){animation-delay:0.05s;}
.option-btn:nth-child(2){animation-delay:0.12s;}
.option-btn:nth-child(3){animation-delay:0.19s;}
.option-btn:nth-child(4){animation-delay:0.26s;}
@keyframes optionSlide{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:translateX(0);}}
.option-btn.correct{background:#dcfce7;animation:correctPop 0.5s cubic-bezier(.34,1.56,.64,1);}
.option-btn.wrong{background:#fee2e2;animation:wrongShake 0.4s ease;}
@keyframes correctPop{0%{transform:scale(1);}40%{transform:scale(1.06);}70%{transform:scale(0.97);}100%{transform:scale(1);}}
@keyframes wrongShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.option-btn:disabled{pointer-events:none;}
.option-letter{width:36px;height:36px;border-radius:50%;background:#166534;color:white;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.25s,transform 0.3s;}
.option-btn.correct .option-letter{background:#16a34a;transform:rotate(360deg) scale(1.2);}
.option-btn.wrong .option-letter{background:#dc2626;}
.option-text{font-size:17px;font-weight:700;color:#1a2e10;}
.condor-container{display:none;position:absolute;bottom:90px;left:16px;right:16px;z-index:999;align-items:flex-end;gap:12px;}
.condor-container.show{display:flex;animation:condorEntrance 0.5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes condorEntrance{from{opacity:0;transform:translateY(40px) scale(0.85);}to{opacity:1;transform:translateY(0) scale(1);}}
.condor-avatar{width:120px;height:120px;object-fit:contain;flex-shrink:0;animation:condorFloat 3s ease-in-out infinite alternate;margin-bottom:-10px;filter:drop-shadow(0 15px 25px rgba(0,0,0,0.65));}
@keyframes condorFloat{from{transform:translateY(0);}to{transform:translateY(-8px);}}
.speech-bubble{flex:1;background:white;border-radius:22px;padding:16px 18px;position:relative;box-shadow:0 16px 64px rgba(0,0,0,0.65);color:#1a2e10;font-size:15px;font-weight:700;line-height:1.4;border:3px solid var(--bubble-color, #22c55e);transition:border-color 0.2s;}
.speech-bubble::after{content:'';position:absolute;bottom:24px;left:-10px;border-width:10px 10px 10px 0;border-style:solid;border-color:transparent white transparent transparent;display:block;width:0;z-index:2;}
.speech-bubble::before{content:'';position:absolute;bottom:22px;left:-14px;border-width:12px 12px 12px 0;border-style:solid;border-color:transparent var(--bubble-color, #22c55e) transparent transparent;display:block;width:0;z-index:1;transition:border-color 0.2s;}
.nav-row{width:100%;display:flex;align-items:center;gap:10px;margin-top:4px;}
.nav-btn{border:none;border-radius:50px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;flex:1;font-family:'Nunito',sans-serif;transition:transform 0.15s,filter 0.15s;}
.nav-btn:hover{transform:scale(1.04);}
.nav-btn:active{transform:scale(0.95);}
.nav-btn:disabled{opacity:0.4;pointer-events:none;}
.nav-restart{background:white;color:#1a2e10;}
.nav-next{background:#22c55e;color:white;flex:1;font-size:16px;animation:nextGlow 2s ease-in-out infinite;}
@keyframes nextGlow{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.5);}50%{box-shadow:0 0 14px 4px rgba(34,197,94,0.35);}}
.score-screen{background:white;border-radius:22px;padding:28px 24px;text-align:center;width:100%;display:none;flex-direction:column;align-items:center;gap:12px;}
.score-screen.show{display:flex;animation:scoreEntrance 0.7s cubic-bezier(.34,1.56,.64,1);}
@keyframes scoreEntrance{from{opacity:0;transform:scale(0.7) rotate(-5deg);}to{opacity:1;transform:scale(1) rotate(0);}}
.score-emoji{font-size:56px;animation:emojiSpin 0.8s cubic-bezier(.34,1.56,.64,1) 0.3s both;}
@keyframes emojiSpin{from{transform:scale(0) rotate(-180deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.score-title{font-size:26px;font-weight:900;color:#1a2e10;}
.score-sub{font-size:16px;font-weight:700;color:#166534;}
.score-num{font-size:48px;font-weight:900;color:#22c55e;animation:numCount 0.6s cubic-bezier(.34,1.56,.64,1) 0.5s both;}
@keyframes numCount{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.score-comment{font-size:15px;font-weight:700;color:#555;}
.restart-btn{background:#22c55e;color:white;border:none;border-radius:50px;padding:14px 36px;font-size:17px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:8px;animation:restartPulse 2s ease-in-out infinite;transition:transform 0.15s;}
@keyframes restartPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.5);}50%{box-shadow:0 0 0 10px rgba(34,197,94,0);}}
.restart-btn:hover{transform:scale(1.06);}
.confetti-container{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden;}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(750px) rotate(720deg);opacity:0;}}

/* ── Tablet pequeña 600-767px ── */
@media (min-width: 600px) and (max-width: 767px) {
  .content {
    max-width: 580px;
    padding: 20px 20px 20px;
    gap: 12px;
  }
  .titulo-img { max-width: 200px; }
  .trivia-logo-img { max-width: 300px; margin: -24px 0 6px 0; }
  .progress-label { font-size: 15px; padding: 7px 16px; }
  .progress-track { height: 12px; }
  .question-card { padding: 26px 22px 20px; border-radius: 26px; }
  .question-text { font-size: 22px; }
  .options { gap: 10px; }
  .option-btn { padding: 15px 20px; border-radius: 20px; }
  .option-letter { width: 44px; height: 44px; font-size: 20px; }
  .option-text { font-size: 20px; }
  .nav-row { gap: 10px; margin-top: 8px; }
  .nav-btn { padding: 16px 22px; font-size: 18px; }
  .nav-next { font-size: 19px; }
  .condor-container { bottom: 90px; left: 16px; right: 16px; gap: 14px; }
  .condor-avatar { width: 140px; height: 140px; margin-bottom: -10px; }
  .speech-bubble { font-size: 17px; padding: 18px 22px; border-radius: 26px; border-width: 4px; }
  .speech-bubble::before { border-width: 14px 14px 14px 0; left: -16px; bottom: 26px; }
  .speech-bubble::after { border-width: 11px 11px 11px 0; left: -11px; bottom: 30px; }
  .score-screen { padding: 36px 28px; border-radius: 28px; gap: 14px; }
  .score-emoji { font-size: 68px; }
  .score-title { font-size: 30px; }
  .score-sub { font-size: 20px; }
  .score-num { font-size: 60px; }
  .score-comment { font-size: 18px; }
  .restart-btn { padding: 16px 48px; font-size: 20px; }
}

/* ── Tablet portrait 768px-1024px (ej. 1200x2000) ── */
@media (min-width: 768px) and (max-width: 1024px) {
  .content {
    max-width: 700px;
    padding: 24px 28px 24px;
    gap: 14px;
  }
  .titulo-img { max-width: 200px; }
  .trivia-logo-img { max-width: 310px; margin: -28px 0 8px 0; }
  .progress-label { font-size: 16px; padding: 8px 18px; }
  .progress-track { height: 13px; }
  .question-card { padding: 28px 28px 22px; border-radius: 28px; }
  .question-text { font-size: 24px; }
  .options { gap: 12px; }
  .option-btn { padding: 16px 24px; border-radius: 22px; }
  .option-letter { width: 46px; height: 46px; font-size: 21px; }
  .option-text { font-size: 21px; }
  .nav-row { gap: 12px; margin-top: 10px; }
  .nav-btn { padding: 17px 24px; font-size: 19px; }
  .nav-next { font-size: 20px; }
  .condor-container { bottom: 96px; left: 20px; right: 20px; gap: 16px; }
  .condor-avatar { width: 150px; height: 150px; margin-bottom: -10px; }
  .speech-bubble { font-size: 18px; padding: 20px 24px; border-radius: 28px; border-width: 4px; }
  .speech-bubble::before { border-width: 16px 16px 16px 0; left: -18px; bottom: 28px; }
  .speech-bubble::after { border-width: 12px 12px 12px 0; left: -12px; bottom: 32px; }
  .score-screen { padding: 40px 32px; border-radius: 30px; gap: 16px; }
  .score-emoji { font-size: 72px; }
  .score-title { font-size: 32px; }
  .score-sub { font-size: 20px; }
  .score-num { font-size: 64px; }
  .score-comment { font-size: 19px; }
  .restart-btn { padding: 17px 52px; font-size: 21px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="bg"></div>
  <div class="confetti-container" id="confetti"></div>
  <div class="content">
    <img class="titulo-img brand-pill" src="titulovertical2.png" alt="Valle Viejo" />
    <img class="trivia-logo-img" src="trivia.png" alt="¡TRIVIA!" />
    <div class="progress-row">
      <div class="progress-label" id="progressLabel">Pregunta 1 de 5</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:20%"></div></div>
    </div>
    <div class="question-card" id="questionCard">
      <p class="question-text" id="questionText"></p>
    </div>
    <div class="options" id="optionsContainer"></div>
    <div class="condor-container" id="condorContainer">
      <img src="condor.webp" class="condor-avatar" alt="Cóndor" />
      <div class="speech-bubble" id="speechBubble"></div>
    </div>
    <div class="score-screen" id="scoreScreen">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-title">¡Trivia terminada!</div>
      <div class="score-sub">Tu puntaje</div>
      <div class="score-num" id="scoreNum"></div>
      <div class="score-comment" id="scoreComment"></div>
      <button class="restart-btn" onclick="window.location.href='index.html'">Jugar de nuevo</button>
    </div>
    <div class="nav-row" id="navRow">
      <button class="nav-btn nav-restart" onclick="restart()">Reiniciar</button>
      <button class="nav-btn nav-next" id="btnNext" onclick="goNext()">Siguiente</button>
    </div>
  </div>
</div>

<script>
// ── Audio Engine (Web Audio API) ──────────────────────────────────
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let _actx=null;
function actx(){if(!_actx)_actx=new AudioCtx();return _actx;}

function sndClick(){
  const c=actx(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.type='sine';o.frequency.setValueAtTime(900,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(500,c.currentTime+0.06);
  g.gain.setValueAtTime(0.25,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.08);
  o.start();o.stop(c.currentTime+0.1);
}

function sndCorrect(){
  const c=actx();
  [[0,523.25],[0.11,659.25],[0.22,783.99],[0.33,1046.5]].forEach(([t,f])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(0.38,c.currentTime+t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.28);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+0.32);
  });
  const o2=c.createOscillator(),g2=c.createGain();
  o2.connect(g2);g2.connect(c.destination);
  o2.type='triangle';o2.frequency.value=2093;
  g2.gain.setValueAtTime(0.12,c.currentTime+0.36);
  g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.65);
  o2.start(c.currentTime+0.36);o2.stop(c.currentTime+0.7);
}

function sndWrong(){
  const c=actx();
  [[0,280,90],[0.18,240,75]].forEach(([t,f0,f1])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(f0,c.currentTime+t);
    o.frequency.exponentialRampToValueAtTime(f1,c.currentTime+t+0.22);
    g.gain.setValueAtTime(0.35,c.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.24);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+0.26);
  });
}

function sndQuestion(){
  const c=actx();
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.type='sine';
  o.frequency.setValueAtTime(180,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(720,c.currentTime+0.22);
  g.gain.setValueAtTime(0.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.28);
  o.start();o.stop(c.currentTime+0.3);
  [[0.28,440],[0.36,554.37],[0.44,659.25]].forEach(([t,f])=>{
    const o2=c.createOscillator(),g2=c.createGain();
    o2.connect(g2);g2.connect(c.destination);
    o2.type='triangle';o2.frequency.value=f;
    g2.gain.setValueAtTime(0.22,c.currentTime+t);
    g2.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.18);
    o2.start(c.currentTime+t);o2.stop(c.currentTime+t+0.2);
  });
}
// ─────────────────────────────────────────────────────────────────

// ── Pool completo de 18 preguntas reales ──────────────────────────
const allQuestions=[
  {
    q:"¿Cuál es la Plaza Principal de Valle Viejo?",

const QUESTIONS_PER_ROUND = 5;

// Fisher-Yates shuffle
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Elige 5 preguntas al azar y mezcla el orden de las opciones de cada una
function buildRound(){
  const picked=shuffle(allQuestions).slice(0,QUESTIONS_PER_ROUND);
  return picked.map(q=>{
    const correctText=q.opts[q.correct];
    const shuffledOpts=shuffle(q.opts);
    return {
      q: q.q,
      opts: shuffledOpts,
      correct: shuffledOpts.indexOf(correctText),
      exp: q.exp
    };
  });
}

let questions=buildRound();
let current=0,score=0,answered=false;
const colors=['#22c55e','#f59e0b','#3b82f6','#ec4899','#a855f7','#f97316','#06b6d4'];

// ── Estadísticas (sin-conexión → sync automático) ─────────────────
// Pegá la URL del Apps Script aquí después de configurarlo (ver SETUP_INSTRUCCIONES.md)
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyKL5ZM6jBrB_gFwflZJaXfDu9G6ogPT-fHRO_F3xXwfxe9ulFLWzOjL-z-GAgXuwUd/exec';

function getTabletId(){
  let id=localStorage.getItem('trivia_tablet_id');
  if(!id){ id='tablet_'+Math.random().toString(36).substr(2,9); localStorage.setItem('trivia_tablet_id',id); }
  return id;
}

let gameStats={startTime:null,results:[]};

async function syncStats(){
  if(!WEBHOOK_URL||!navigator.onLine)return;
  const pending=JSON.parse(localStorage.getItem('trivia_pending_stats')||'[]');
  if(!pending.length)return;
  for(const stat of [...pending]){
    try{
      await fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(stat)});
      const queue=JSON.parse(localStorage.getItem('trivia_pending_stats')||'[]');
      localStorage.setItem('trivia_pending_stats',JSON.stringify(queue.filter(s=>s.timestamp!==stat.timestamp)));
    }catch(e){break;}
  }
}

function saveGameStats(sc,tot,stats){
  if(!WEBHOOK_URL)return;
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stat={
    timestamp:now.toISOString(),
    date:`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`,
    time:`${pad(now.getHours())}:${pad(now.getMinutes())}`,
    tablet_id:getTabletId(),
    score:sc,
    total:tot,
    duration_seconds:stats.startTime?Math.round((now-stats.startTime)/1000):0,
    questions:stats.results
  };
  const queue=JSON.parse(localStorage.getItem('trivia_pending_stats')||'[]');
  queue.push(stat);
  localStorage.setItem('trivia_pending_stats',JSON.stringify(queue));
  syncStats();
}

window.addEventListener('online',syncStats);
syncStats(); // intento al cargar la página

function launchConfetti(){
  const c=document.getElementById('confetti');
  c.innerHTML='';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=6+Math.random()*10;
    const isRect=Math.random()>0.5;
    p.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};width:${size}px;height:${isRect?size*0.4:size}px;border-radius:${isRect?'2px':'50%'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    c.appendChild(p);
  }
  setTimeout(()=>{c.innerHTML='';},3500);
}

function launchMiniConfetti(){
  const c=document.getElementById('confetti');
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=5+Math.random()*7;
    p.style.cssText=`left:${20+Math.random()*60}%;background:${colors[Math.floor(Math.random()*colors.length)]};width:${size}px;height:${size}px;border-radius:50%;animation-duration:${0.8+Math.random()*1}s;animation-delay:0s;`;
    c.appendChild(p);
  }
  setTimeout(()=>{c.innerHTML='';},2000);
}

function render(){
  sndQuestion();
  answered=false;
  // Resetear stats al inicio de cada partida nueva
  if(current===0) gameStats={startTime:new Date(),results:[]};
  const q=questions[current];
  document.getElementById('progressLabel').textContent=`Pregunta ${current+1} de ${questions.length}`;
  document.getElementById('progressFill').style.width=`${((current+1)/questions.length)*100}%`;

  const qCard=document.getElementById('questionCard');
  qCard.style.animation='none';
  void qCard.offsetWidth;
  qCard.style.animation='cardEntrance 0.5s cubic-bezier(.34,1.56,.64,1) both';
  document.getElementById('questionText').textContent=q.q;

  const letters=['A','B','C','D'];
  const container=document.getElementById('optionsContainer');
  container.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML=`<div class="option-letter">${letters[i]}</div><span class="option-text">${opt}</span>`;
    btn.style.animationDelay=`${0.05+i*0.07}s`;
    btn.addEventListener('mousemove',e=>{
      const r=btn.getBoundingClientRect();
      btn.style.setProperty('--mx',`${((e.clientX-r.left)/r.width)*100}%`);
      btn.style.setProperty('--my',`${((e.clientY-r.top)/r.height)*100}%`);
    });
    btn.onclick=()=>{sndClick();selectOption(i,btn);};
    container.appendChild(btn);
  });

  document.getElementById('condorContainer').className='condor-container';
  document.getElementById('speechBubble').innerHTML='';
  document.getElementById('scoreScreen').className='score-screen';
  document.getElementById('questionCard').style.display='';
  document.getElementById('optionsContainer').style.display='';
  document.getElementById('navRow').style.display='';
}

function selectOption(idx,btn){
  if(answered)return;
  answered=true;
  const q=questions[current];
  // Registrar resultado para estadísticas
  const isCorrect=idx===q.correct;
  gameStats.results.push({text:q.q,correct:isCorrect});
  const allBtns=document.querySelectorAll('.option-btn');
  allBtns.forEach(b=>b.disabled=true);
  const speechBubble=document.getElementById('speechBubble');

  let prefix='';
  if(isCorrect){
    btn.classList.add('correct');
    score++;
    prefix='<strong style="color:#16a34a;display:block;margin-bottom:4px;font-size:16px;">¡Correcto! 🎉</strong>';
    sndCorrect();
    launchMiniConfetti();
    speechBubble.style.setProperty('--bubble-color','#22c55e');
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('correct');
    prefix='<strong style="color:#dc2626;display:block;margin-bottom:4px;font-size:16px;">¡Incorrecto! ❌</strong>';
    sndWrong();
    speechBubble.style.setProperty('--bubble-color','#ef4444');
  }
  speechBubble.innerHTML=prefix+q.exp;
  document.getElementById('condorContainer').className='condor-container show';
}

function goNext(){
  if(current<questions.length-1){
    current++;
    render();
  } else {
    showScore();
  }
}

function goBack(){
  if(current>0){current--;render();}
}

function showScore(){
  document.getElementById('questionCard').style.display='none';
  document.getElementById('optionsContainer').style.display='none';
  document.getElementById('condorContainer').className='condor-container';
  document.getElementById('navRow').style.display='none';
  const ss=document.getElementById('scoreScreen');
  ss.className='score-screen show';
  document.getElementById('scoreNum').textContent=`${score} / ${questions.length}`;
  const pct=score/questions.length;
  let emoji,comment;
  if(pct===1){emoji='🏆';comment='¡Puntaje perfecto! Sos un experto en Valle Viejo.';}
  else if(pct>=0.6){emoji='🌟';comment='¡Muy bien! Conocés bastante la región.';}
  else if(pct>=0.4){emoji='👏';comment='Buen intento, ¡seguí aprendiendo!';}
  else{emoji='📚';comment='Te queda mucho por descubrir sobre Valle Viejo.';}
  document.getElementById('scoreEmoji').textContent=emoji;
  document.getElementById('scoreComment').textContent=comment;
  if(pct>=0.6)launchConfetti();
  // Guardar y sincronizar estadísticas
  saveGameStats(score,questions.length,gameStats);
}

function restart(){
  // Nueva ronda con preguntas y opciones aleatorias cada vez
  questions=buildRound();
  current=0;score=0;
  document.getElementById('questionCard').style.display='';
  document.getElementById('optionsContainer').style.display='';
  document.getElementById('navRow').style.display='';
  render();
}

render();
